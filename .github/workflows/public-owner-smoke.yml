name: Public owner smoke

on:
  push:
  pull_request:

jobs:
  synthetic-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Public synthetic owner test
        run: python -m pytest -q tests/test_pr52_owner_capture_smoke.py
      - name: Targeted lint
        run: ruff check tests/test_pr52_owner_capture_smoke.py
