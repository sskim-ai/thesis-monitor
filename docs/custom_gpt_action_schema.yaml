openapi: 3.1.0
info:
  title: Thesis Monitor API
  version: 0.1.0
  description: API for collecting and normalizing thesis-relevant company events. This API does not make buy or sell recommendations.
servers:
  - url: https://example-deployment-url.com
    description: Replace with the deployed Thesis Monitor server URL.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: Service health status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                required: [status]
  /watchlist:
    get:
      operationId: getWatchlist
      summary: List watchlist items
      responses:
        "200":
          description: Watchlist items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistItem"
    post:
      operationId: addWatchlistItem
      summary: Add or update a watchlist item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistItemCreate"
      responses:
        "200":
          description: Added or updated watchlist item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistItem"
  /thesis-events:
    get:
      operationId: getThesisEvents
      summary: Get thesis-relevant events for a ticker
      parameters:
        - name: ticker
          in: query
          required: true
          schema:
            type: string
          description: Ticker symbol, such as NVDA.
        - name: lookback_days
          in: query
          required: false
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 365
      responses:
        "200":
          description: Thesis event response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThesisEventResponse"
  /earnings-checkpoints:
    get:
      operationId: getEarningsCheckpoints
      summary: Get earnings checkpoint data for a ticker
      parameters:
        - name: ticker
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Earnings checkpoints.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EarningsCheckpoint"
  /company-profile:
    get:
      operationId: getCompanyProfile
      summary: Get company profile for a ticker
      parameters:
        - name: ticker
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Company profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfile"
components:
  schemas:
    WatchlistItemCreate:
      type: object
      properties:
        ticker:
          type: string
        company_name:
          type: string
        exchange:
          type: string
        notes:
          type: string
      required: [ticker, company_name]
    WatchlistItem:
      allOf:
        - $ref: "#/components/schemas/WatchlistItemCreate"
        - type: object
          properties:
            id:
              type: integer
            created_at:
              type: string
              format: date-time
          required: [id, created_at]
    CompanyProfile:
      type: object
      properties:
        ticker:
          type: string
        company_name:
          type: string
        exchange:
          type: string
        industry:
          type: string
        sector:
          type: string
        business_units:
          type: array
          items:
            type: string
        major_revenue_sources:
          type: array
          items:
            type: string
        major_customers:
          type: array
          items:
            type: string
        ir_url:
          type: string
        filings_url:
          type: string
      required: [ticker, company_name, business_units, major_revenue_sources, major_customers]
    ThesisEventResponse:
      type: object
      properties:
        ticker:
          type: string
        company_name:
          type: string
        lookback_days:
          type: integer
        events:
          type: array
          items:
            $ref: "#/components/schemas/ThesisEvent"
      required: [ticker, lookback_days, events]
    ThesisEvent:
      type: object
      properties:
        date:
          type: string
          format: date
        source:
          type: string
        title:
          type: string
        url:
          type: string
        event_type:
          type: string
          enum:
            - new_customer
            - large_order
            - production_order
            - mass_production_change
            - revenue_guidance_up
            - revenue_guidance_down
            - margin_improvement
            - margin_deterioration
            - fcf_deterioration
            - inventory_increase
            - inventory_normalization
            - receivables_increase
            - dilution_risk
            - capital_raise
            - convertible_bond
            - warrant
            - stock_compensation_increase
            - partnership
            - partnership_to_revenue
            - customer_loss
            - customer_concentration_risk
            - market_share_change
            - competitor_price_cut
            - competitor_new_product
            - technology_competition
            - regulatory_risk
            - export_control
            - antitrust
            - accounting_issue
            - debt_liquidity_risk
            - credit_rating_change
            - management_governance
            - capital_allocation
            - earnings_surprise
            - earnings_miss
            - guidance_change
            - valuation_recalculation_needed
            - non_thesis_noise
        confirmed_facts:
          type: array
          items:
            type: string
        inferred_implications:
          type: array
          items:
            type: string
        unknowns:
          type: array
          items:
            type: string
        financial_impact:
          $ref: "#/components/schemas/FinancialImpact"
        thesis_relevance:
          $ref: "#/components/schemas/ThesisRelevance"
      required:
        - date
        - source
        - title
        - url
        - event_type
        - confirmed_facts
        - inferred_implications
        - unknowns
        - financial_impact
        - thesis_relevance
    FinancialImpact:
      type: object
      properties:
        revenue_guidance_changed:
          type: boolean
        margin_guidance_changed:
          type: boolean
        fcf_impact_known:
          type: boolean
        dilution_risk:
          type: boolean
      required:
        - revenue_guidance_changed
        - margin_guidance_changed
        - fcf_impact_known
        - dilution_risk
    ThesisRelevance:
      type: object
      properties:
        requires_review:
          type: boolean
        relevance_score:
          type: integer
          minimum: 0
          maximum: 100
        reason:
          type: string
      required: [requires_review, relevance_score, reason]
    EarningsCheckpoint:
      type: object
      properties:
        ticker:
          type: string
        period:
          type: string
        reported_date:
          type: string
          format: date
        revenue:
          type: number
        operating_income:
          type: number
        net_income:
          type: number
        eps:
          type: number
        operating_cash_flow:
          type: number
        free_cash_flow:
          type: number
        capex:
          type: number
        gross_margin:
          type: number
        operating_margin:
          type: number
        guidance:
          type: string
        backlog:
          type: number
        inventory:
          type: number
        receivables:
          type: number
        debt:
          type: number
        cash:
          type: number
        stock_compensation:
          type: number
        dilution_notes:
          type: string
      required: [ticker, period]

