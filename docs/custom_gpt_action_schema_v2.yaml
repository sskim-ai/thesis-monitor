      "post": {
        "tags": [
          "monitoring"
        ],
        "summary": "Record an independent daily thesis and valuation assessment",
        "operationId": "recordThesisAssessment",
        "security": [
          {
            "APIKeyHeader": []
          }
        ],
        "parameters": [
          {
            "name": "ticker",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "title": "Ticker"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "assessment_date": {
                    "type": "string",
                    "format": "date"
                  },
                  "business_thesis_change": {
                    "type": "string",
                    "enum": [
                      "strengthened",
                      "weakened",
                      "mixed",
                      "no_material_change",
                      "invalidation_candidate",
                      "invalidated",
                      "needs_review"
                    ]
                  },
                  "valuation_context": {
                    "type": "string",
                    "enum": [
                      "expansion",
                      "compression",
                      "mixed",
                      "neutral",
                      "unknown"
                    ]
                  },
                  "earnings_estimate_impact": {
                    "type": "string",
                    "enum": [
                      "up",
                      "down",
                      "unchanged",
                      "mixed",
                      "unknown"
                    ]
                  },
                  "market_expectation_assessment": {
                    "type": "object",
                    "properties": {
                      "level": {
                        "type": "string"
                      },
                      "assessment": {
                        "type": "string"
                      },
                      "summary": {
                        "type": "string"
                      },
                      "evidence_basis": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        }
                      }
                    }
                  },
                  "confirmed_facts": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    }
                  },
                  "inferred_implications": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    }
                  },
                  "unknowns": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    }
                  },
                  "summary": {
                    "type": "string"
                  },
                  "new_buyer_view": {
                    "type": "string"
                  },
                  "holder_view": {
                    "type": "string"
                  },
                  "price_view": {
                    "type": "string"
                  },
                  "risk_level": {
                    "type": "string"
                  },
                  "confidence": {
                    "type": "number",
                    "minimum": 0,
                    "maximum": 1
                  }
                },
                "required": [
                  "assessment_date",
                  "business_thesis_change",
                  "valuation_context"
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ThesisAssessmentRead"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
