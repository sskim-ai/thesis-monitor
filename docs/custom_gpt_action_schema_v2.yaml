    "/monitoring-items": {
      "post": {
        "tags": [
          "monitoring"
        ],
        "summary": "Start or update thesis monitoring for a stock",
        "description": "Use when the user says a stock should be monitored going forward. First collect current company evidence and construct a concrete thesis. Changed thesis fields create a new version; an identical request is idempotent.",
        "operationId": "monitorStock",
        "security": [
          {
            "APIKeyHeader": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "ticker": {
                    "type": "string",
                    "minLength": 1
                  },
                  "company_name": {
                    "type": "string",
                    "minLength": 1
                  },
                  "exchange": {
                    "type": "string"
                  },
                  "core_thesis": {
                    "type": "string",
                    "minLength": 1
                  },
                  "time_horizon": {
                    "type": "string"
                  },
                  "thesis_drivers": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    }
                  },
                  "validation_metrics": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    }
                  },
                  "strengthen_signals": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    }
                  },
                  "weaken_signals": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    }
                  },
                  "invalidation_signals": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    }
                  },
                  "price_rules": {
                    "type": "object",
                    "properties": {
                      "currency": {
                        "type": "string"
                      },
                      "basis": {
                        "type": "string",
                        "enum": [
                          "close"
                        ]
                      },
                      "confirmation_price": {
                        "type": "number"
                      },
                      "support_zone_low": {
                        "type": "number"
                      },
                      "support_zone_high": {
                        "type": "number"
                      },
                      "warning_price": {
                        "type": "number"
                      },
                      "invalidation_price": {
                        "type": "number"
                      }
                    }
                  },
                  "market_expectations": {
                    "type": "object",
                    "properties": {
                      "as_of_date": {
                        "type": "string",
                        "format": "date"
                      },
                      "level": {
                        "type": "string",
                        "enum": [
                          "depressed",
                          "low",
                          "balanced",
                          "elevated",
                          "very_high",
                          "speculative",
                          "unknown"
                        ]
                      },
                      "summary": {
                        "type": "string"
                      },
                      "priced_in": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        }
                      },
                      "upside_surprises": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        }
                      },
                      "downside_surprises": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        }
                      },
                      "evidence_basis": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        }
                      }
                    }
                  },
                  "valuation_framework": {
                    "type": "object",
                    "properties": {
                      "primary_method": {
                        "type": "string"
                      },
                      "secondary_methods": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        }
                      },
                      "rationale": {
                        "type": "string"
                      },
                      "key_inputs": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        }
                      },
                      "peer_or_historical_basis": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        }
                      },
                      "valuation_caveats": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        }
                      }
                    }
                  },
                  "multiple_expansion_signals": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    }
                  },
                  "multiple_compression_signals": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    }
                  },
                  "macro_exposures": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "factor": {
                          "type": "string",
                          "minLength": 1
                        },
                        "direction": {
                          "type": "string",
                          "enum": [
                            "positive",
                            "negative",
                            "mixed"
                          ]
                        },
                        "weight": {
                          "type": "integer",
                          "minimum": 1,
                          "maximum": 5
                        },
                        "channel": {
                          "type": "string",
                          "minLength": 1
                        },
                        "horizon": {
                          "type": "string"
                        },
                        "condition": {
                          "type": "string"
                        },
                        "review_required": {
                          "type": "boolean"
                        }
                      },
                      "required": [
                        "factor",
                        "direction",
                        "channel"
                      ]
                    }
                  }
                },
                "required": [
                  "ticker",
                  "company_name",
                  "core_thesis"
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MonitoringItemRead"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      },
