  "openapi": "3.1.0",
  "info": {
    "title": "Thesis Monitor Public Action API",
    "version": "0.4.3",
    "description": "Collect thesis evidence, read ticker analysis snapshots, register versioned investment theses, manage the monitored stock list, read daily thesis assessments, and retrieve macro briefings, regimes, events, and ticker-level macro impacts. Administrative jobs are excluded."
  },
