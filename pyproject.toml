[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-monitor"
version = "0.1.0"
description = "FastAPI thesis monitoring system for investment research event collection and normalization."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.11,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "sqlmodel>=0.0.21,<0.1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff==0.15.20",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
